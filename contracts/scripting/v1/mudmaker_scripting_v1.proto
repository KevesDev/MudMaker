syntax = "proto3";
package mudmaker.scripting.v1;
option csharp_namespace = "MudMaker.Scripting.V1.Wire";

// Contract schema, not yet generated or exercised by a host.
// Every message is size-limited by transport; UUID fields are canonical UUID strings.
// Field numbers MUST be reserved on deletion; never reuse them.
message AssetRef { string id = 1; uint32 revision = 2; }
message EntityRef { string world_id = 1; uint64 entity_id = 2; uint32 generation = 3; }
message ScopeRef { string id = 1; uint32 revision = 2; }
message FieldRef { string component_type_id = 1; string field_id = 2; uint32 schema_revision = 3; }
enum StateScope { STATE_SCOPE_UNSPECIFIED = 0; SCOPE_WORLD = 1; SCOPE_REGION = 2; SCOPE_ENTITY = 3; SCOPE_PLAYER = 4; SCOPE_QUEST_ATTEMPT = 5; SCOPE_ENCOUNTER = 6; }
message StateSlotRef {
  StateScope scope = 1;
  string world_id = 2;
  string schema_id = 3;
  string key = 4;
  EntityRef entity_owner = 5;
  string scoped_owner_id = 6;
}
message PropertyValue {
  oneof value {
    bool boolean_value = 1;
    sint64 integer_value = 2;
    double floating_value = 3;
    string text_value = 4;
    EntityRef entity_value = 5;
    AssetRef asset_value = 6;
    bool explicit_null = 7;
  }
}
message ComponentFieldSnapshot {
  EntityRef owner = 1; FieldRef field = 2; PropertyValue value = 3; uint64 version = 4;
}
message StateSlotSnapshot {
  StateSlotRef slot = 1; PropertyValue value = 2; uint64 version = 3;
}
message QuestAttempt {
  AssetRef quest = 1;
  string attempt_id = 2;
  QuestState state = 3;
  repeated string credited_objectives = 4;
}
enum QuestState {
  QUEST_STATE_UNSPECIFIED = 0;
  QUEST_ABSENT = 1;
  QUEST_OFFERED = 2;
  QUEST_ACTIVE = 3;
  QUEST_READY = 4;
  QUEST_COMPLETED = 5;
  QUEST_FAILED = 6;
  QUEST_ABANDONED = 7;
}
enum ActorKind { ACTOR_KIND_UNSPECIFIED = 0; ACTOR_PLAYER = 1; ACTOR_WORLD_SYSTEM = 2; }
message ActorSnapshot {
  EntityRef actor = 1;
  string display_name = 2;
  string name_key = 3;
  repeated QuestAttempt quest_attempts = 4;
  repeated AssetRef aboard_vehicles = 5;
  ActorKind kind = 6;
}
message WorldReadSnapshot {
  string world_id = 1;
  uint64 revision = 2;
  repeated AssetRef in_transit_vehicles = 3;
  repeated AssetRef active_world_event_definitions = 4;
}
message EntityVersion { EntityRef entity = 1; uint64 version = 2; }
message BaseEvent { string event_id = 1; }
message DialogueChoice { string event_id = 1; string session_id = 2; string choice_key = 3; }
message QuizEvaluated {
  string event_id = 1;
  string session_id = 2;
  bool is_correct = 3;
  bool session_owned_by_actor = 4;
}
message QuestTurnIn { string event_id = 1; string attempt_id = 2; }
message QuestLifecycle {
  string event_id = 1;
  string attempt_id = 2;
  QuestState before_state = 3;
  QuestState after_state = 4;
}
message ObjectiveCredit { string event_id = 1; string attempt_id = 2; string objective_key = 3; }
message RewardClaim { string event_id = 1; string attempt_id = 2; AssetRef reward = 3; }
message EntityMove {
  string event_id = 1; EntityRef entity = 2;
  EntityRef origin = 3; EntityRef destination = 4;
}
message Transit { string event_id = 1; EntityRef vehicle = 2; EntityRef station = 3; }
message WorldEventLifecycle {
  string event_id = 1; AssetRef definition = 2; ScopeRef scope = 3;
  WorldEventAction action = 4;
}
message ItemEvent { string event_id = 1; EntityRef item = 2; EntityRef other_party = 3; }
message EntityLifecycle { string event_id = 1; EntityRef entity = 2; AssetRef prototype = 3; }
message TimerFired { string event_id = 1; AssetRef timer = 2; string occurrence_id = 3; }


message EntityLifecycleHook {
  string event_id = 1; EntityRef subject = 2; EntityRef related = 3; AssetRef prototype = 4;
}
message MovementHook {
  string event_id = 1; EntityRef mover = 2; EntityRef origin = 3;
  EntityRef destination = 4; EntityRef exit = 5;
}
message PresentationQuery {
  string event_id = 1; EntityRef viewer = 2; EntityRef subject = 3; string current_text = 4;
  uint32 count = 5;
}
message CommandHook {
  string event_id = 1; string command_key = 2; string arguments = 3;
}
message AccountHook {
  string event_id = 1; string account_id = 2;
  EntityRef character = 3; string reason_code = 4;
}
message ChannelHook {
  string event_id = 1; string channel_id = 2; EntityRef sender = 3;
  string message = 4; string recipient_account_id = 5;
}
message ScheduleHook {
  string event_id = 1; string schedule_id = 2; string occurrence_id = 3;
}
message HostHook { string event_id = 1; string lifecycle_code = 2; }
message AccessHook {
  string event_id = 1; EntityRef subject = 2; EntityRef object = 3;
  string access_key = 4; bool engine_allowed = 5;
}
message QueryHook { string event_id = 1; string key = 2; string default_value = 3; }
// Host-computed aggregate control state; no raw session identifiers or credentials.
enum CombatControlState {
  COMBAT_CONTROL_STATE_UNSPECIFIED = 0;
  COMBAT_ONLINE = 1;
  COMBAT_LINK_LOST = 2;
  COMBAT_GRACE_PERIOD = 3;
  COMBAT_OFFLINE = 4;
}
message CombatConnectionSnapshot {
  CombatControlState state = 1;
  string disconnected_at_utc = 2; // ISO-8601 UTC; empty when not applicable
  string grace_deadline_utc = 3;
  string last_accepted_intent_id = 4;
  uint32 controlling_session_count = 5;
  string reason_code = 6;
  uint64 revision = 7;
}
message CombatControlEvent {
  string event_id = 1;
  string encounter_id = 2;
  EntityRef character = 3;
  CombatConnectionSnapshot before = 4;
  CombatConnectionSnapshot after = 5;
  string occurred_at_utc = 6;
  string cause_code = 7;
}

// Inventory: all references/version numbers rechecked at native commit.
message InventoryTransferEvent { string event_id = 1; EntityRef actor = 2; EntityRef item = 3; EntityRef source = 4; EntityRef destination = 5; int64 quantity = 6; uint64 item_version = 7; uint64 source_version = 8; uint64 destination_version = 9; string action_code = 10; }
message InventoryContainerEvent { string event_id = 1; EntityRef actor = 2; EntityRef container = 3; string action_code = 4; uint64 expected_version = 5; }
message InventoryEquipmentEvent { string event_id = 1; EntityRef actor = 2; EntityRef holder = 3; EntityRef item = 4; string slot_key = 5; string action_code = 6; uint64 expected_version = 7; }
message InventoryTradeEvent { string event_id = 1; string trade_id = 2; EntityRef actor = 3; EntityRef counterparty = 4; string action_code = 5; uint64 expected_version = 6; }
message InventoryMutationEffect { EntityRef actor = 1; EntityRef item = 2; EntityRef source = 3; EntityRef destination = 4; int64 quantity = 5; uint64 expected_item_version = 6; }
message InventoryOpenCloseEffect { EntityRef actor = 1; EntityRef container = 2; bool open = 3; uint64 expected_version = 4; }
message InventoryEquipEffect { EntityRef actor = 1; EntityRef holder = 2; EntityRef item = 3; string slot_key = 4; bool equip = 5; uint64 expected_version = 6; }
message InventoryTradeEffect { EntityRef actor = 1; string trade_id = 2; string action_code = 3; uint64 expected_version = 4; }

enum CombatManagerScope { COMBAT_MANAGER_SCOPE_UNSPECIFIED = 0; COMBAT_ACTOR = 1; COMBAT_TEAM = 2; COMBAT_ENCOUNTER = 3; COMBAT_LOCATION = 4; COMBAT_ARENA = 5; COMBAT_REGION = 6; COMBAT_WORLD = 7; }
enum CombatClockMode { COMBAT_CLOCK_UNSPECIFIED = 0; COMBAT_PULSE = 1; COMBAT_ALTERNATING_TURN = 2; COMBAT_INITIATIVE_ROUND = 3; COMBAT_SIMULTANEOUS_ROUND = 4; COMBAT_REAL_TIME = 5; COMBAT_HYBRID = 6; }
message CombatManagerSnapshot { string manager_instance_id = 1; AssetRef manager_definition = 2; CombatManagerScope scope = 3; ScopeRef owner_scope = 4; string encounter_id = 5; uint64 version = 6; CombatClockMode clock_mode = 7; string phase_key = 8; string next_deadline_utc = 9; repeated EntityRef participants = 10; }
message CombatLifecycleEvent { string event_id = 1; string encounter_id = 2; string manager_instance_id = 3; EntityRef actor = 4; EntityRef target = 5; string action_key = 6; string lifecycle_code = 7; uint64 expected_revision = 8; string occurred_at_utc = 9; string causation_key = 10; CombatManagerSnapshot manager = 11; repeated ComponentFieldSnapshot visible_fields = 12; repeated StateSlotSnapshot visible_state = 13; }
message CombatManagerEffect { string manager_instance_id = 1; string encounter_id = 2; string action_code = 3; EntityRef actor = 4; EntityRef target = 5; AssetRef asset = 6; string argument_key = 7; PropertyValue value = 8; uint64 expected_revision = 9; }

// LOOK: viewer-scoped pure queries and post-observation events.
enum LookMode { LOOK_MODE_UNSPECIFIED = 0; LOOK_LOCATION = 1; LOOK_TARGET = 2; LOOK_CONTENTS = 3; LOOK_DETAIL = 4; LOOK_DETAIL_RELATION = 5; LOOK_EXAMINE = 6; }
enum LookTargetKind { LOOK_TARGET_KIND_UNSPECIFIED = 0; LOOK_LOCATION_TARGET = 1; LOOK_ENTITY_TARGET = 2; LOOK_EXIT_TARGET = 3; LOOK_DETAIL_TARGET = 4; }
message LookQueryEvent { string event_id = 1; EntityRef viewer = 2; EntityRef target = 3; LookMode mode = 4; LookTargetKind target_kind = 5; string query = 6; string relation_key = 7; string authorized_text = 8; uint64 snapshot_revision = 9; }
message LookObservedEvent { string event_id = 1; EntityRef viewer = 2; EntityRef target = 3; LookMode mode = 4; LookTargetKind target_kind = 5; string detail_key = 6; uint64 snapshot_revision = 7; bool succeeded = 8; string result_code = 9; }

// NPC: source-level typed observer-scoped events and host-validated proposals.
enum NpcBehaviorState { NPC_BEHAVIOR_UNSPECIFIED = 0; NPC_IDLE = 1; NPC_TRAVEL = 2; NPC_INTERACT = 3; NPC_ALERT = 4; NPC_ENGAGED = 5; NPC_RETREAT = 6; NPC_UNAVAILABLE = 7; NPC_CUSTOM = 8; }
message NpcLifecycleEvent { string event_id = 1; EntityRef npc = 2; EntityRef actor = 3; EntityRef subject = 4; AssetRef blueprint = 5; string lifecycle_code = 6; string trigger_key = 7; string current_state = 8; string next_state = 9; string reason_code = 10; string scheduled_occurrence_id = 11; uint64 expected_revision = 12; }
message NpcServiceEvent { string event_id = 1; EntityRef npc = 2; EntityRef customer = 3; AssetRef service = 4; string operation_code = 5; EntityRef item = 6; int64 quantity = 7; uint64 expected_revision = 8; string request_key = 9; }
message NpcBehaviorEffect { EntityRef npc = 1; string action_code = 2; EntityRef target = 3; AssetRef asset = 4; string argument_key = 5; PropertyValue value = 6; uint64 expected_revision = 7; }

// Exit traversal and linked door-state operations (native authority).
enum DoorState { DOOR_STATE_UNSPECIFIED = 0; DOOR_OPEN = 1; DOOR_CLOSED = 2; DOOR_LOCKED = 3; DOOR_SEALED = 4; DOOR_DESTROYED = 5; }
message ExitTraversalEvent { string event_id = 1; EntityRef actor = 2; EntityRef exit = 3; EntityRef origin = 4; EntityRef authorized_destination = 5; string outcome_code = 6; string safe_reason_code = 7; uint64 expected_exit_revision = 8; }
message DoorStateEvent { string event_id = 1; EntityRef actor = 2; EntityRef exit = 3; EntityRef door_state_owner = 4; DoorState previous_state = 5; DoorState next_state = 6; string action_code = 7; uint64 expected_revision = 8; }
message TraversalOperationEvent { string event_id = 1; string operation_id = 2; EntityRef actor = 3; EntityRef exit = 4; EntityRef origin = 5; string operation_state = 6; string deadline_utc = 7; string safe_reason_code = 8; uint64 expected_revision = 9; }
message ExitBehaviorEffect { EntityRef actor = 1; EntityRef exit = 2; string action_code = 3; EntityRef destination = 4; DoorState new_door_state = 5; string operation_id = 6; uint64 expected_revision = 7; }

message CommunicationEvent { string event_id = 1; EntityRef sender = 2; EntityRef recipient = 3; string channel_id = 4; string mode = 5; string sanitized_text = 6; string scope_code = 7; string outcome_code = 8; uint64 expected_revision = 9; }
message CraftRequirement { string tag_key = 1; int64 quantity = 2; }
message CraftRequestEvent { string event_id = 1; EntityRef actor = 2; EntityRef station = 3; AssetRef output_template = 4; EntityRef destination = 5; repeated CraftRequirement requirements = 6; string outcome_code = 7; uint64 expected_revision = 8; }
message CraftTransactionEffect { EntityRef actor = 1; EntityRef station = 2; AssetRef output_template = 3; EntityRef destination = 4; repeated CraftRequirement requirements = 5; uint64 expected_revision = 6; }
message SocialRelationshipEvent { string event_id = 1; EntityRef subject = 2; EntityRef target = 3; string relationship_kind = 4; string action_code = 5; int64 value = 6; uint64 expected_revision = 7; }
message SocialRelationshipEffect { EntityRef subject = 1; EntityRef target = 2; string relationship_kind = 3; string action_code = 4; int64 value = 5; uint64 expected_revision = 6; }

// Gameplay tags; project organizational tags are Creator-only metadata.
message TagRef { string project_id = 1; string tag_id = 2; }
message TagAssignmentEvent { string event_id = 1; EntityRef actor = 2; EntityRef subject = 3; TagRef tag = 4; string operation_code = 5; uint64 expected_revision = 6; }
message TagMutationEffect { EntityRef actor = 1; EntityRef subject = 2; TagRef tag = 3; bool add = 4; uint64 expected_revision = 5; }

message HookEvent {
  oneof kind {
    BaseEvent npc_interact = 1;
    DialogueChoice dialogue_choice = 2;
    QuizEvaluated quiz_evaluated = 3;
    QuestTurnIn quest_turn_in = 4;
    QuestLifecycle quest_lifecycle = 5;
    ObjectiveCredit objective_credit = 6;
    RewardClaim reward_claim = 7;
    EntityMove entity_move = 8;
    Transit transit = 9;
    WorldEventLifecycle world_event_lifecycle = 10;
    ItemEvent item_event = 11;
    TimerFired timer_fired = 12;
    BaseEvent player_session = 13;
    EntityLifecycle entity_spawn = 14;
    EntityLifecycle entity_despawn = 15;
    EntityLifecycleHook entity_lifecycle_hook = 16;
    MovementHook movement_hook = 17;
    PresentationQuery presentation_query = 18;
    CommandHook command_hook = 19;
    AccountHook account_hook = 20;
    ChannelHook channel_hook = 21;
    ScheduleHook schedule_hook = 22;
    HostHook host_hook = 23;
    AccessHook access_hook = 24;
    QueryHook query_hook = 25;
    CombatControlEvent combat_control = 26;
    InventoryTransferEvent inventory_transfer = 27;
    InventoryContainerEvent inventory_container = 28;
    InventoryEquipmentEvent inventory_equipment = 29;
    InventoryTradeEvent inventory_trade = 30;
    CombatLifecycleEvent combat_lifecycle = 31;
    LookQueryEvent look_query = 32;
    LookObservedEvent look_observed = 33;
    NpcLifecycleEvent npc_lifecycle = 34;
    NpcServiceEvent npc_service = 35;
    ExitTraversalEvent exit_traversal = 36;
    DoorStateEvent door_state = 37;
    TraversalOperationEvent traversal_operation = 38;
    CommunicationEvent communication = 39;
    CraftRequestEvent craft_request = 40;
    SocialRelationshipEvent social_relationship = 41;
    TagAssignmentEvent tag_assignment = 42;
  }
}
enum HookPhase { HOOK_PHASE_UNSPECIFIED = 0; BEFORE = 1; AFTER = 2; QUERY = 3; }
message HookInvoke {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string invocation_id = 3;
  string request_id = 4;
  string release_hash = 5;
  AssetRef binding = 6;
  string hook_id = 7;
  string module_id = 8;
  string handler_name = 9;
  EntityRef owner = 10;
  ActorSnapshot actor = 11;
  EntityRef target = 12;
  WorldReadSnapshot world = 13;
  HookPhase phase = 14;
  HookEvent event = 15;
  repeated EntityVersion observed_entity_versions = 16;
  repeated string allowed_capabilities = 17;
  uint32 execution_budget_ms = 18; // host enforces expiry using its own monotonic clock
  string trace_id = 19;
  repeated ComponentFieldSnapshot fields = 20;
  repeated StateSlotSnapshot state_slots = 21;
}

enum WorldEventAction {
  WORLD_EVENT_ACTION_UNSPECIFIED = 0;
  START = 1;
  STOP = 2;
}
message StartQuest { EntityRef actor = 1; AssetRef quest = 2; }
message CompleteQuest { string attempt_id = 1; string evidence_event_id = 2; }
message CreditObjective { string attempt_id = 1; string objective_key = 2; string evidence_event_id = 3; }
message ChangeWorldEvent { AssetRef definition = 1; ScopeRef scope = 2; WorldEventAction action = 3; }
message OpenQuiz { EntityRef actor = 1; AssetRef question_set = 2; string quest_attempt_id = 3; }
message RecordQuizResult { string quiz_session_id = 1; bool is_correct = 2; }
message GrantRewardPlan { EntityRef actor = 1; AssetRef reward_plan = 2; string quest_attempt_id = 3; }
message RollRewardTable { EntityRef actor = 1; AssetRef reward_table = 2; string quest_attempt_id = 3; }
message ShowDialogue { EntityRef actor = 1; AssetRef dialogue = 2; }
message EmitDomainEvent { EntityRef actor = 1; AssetRef definition = 2; }
message SetComponentField {
  EntityRef owner = 1; FieldRef field = 2; PropertyValue value = 3; uint64 expected_version = 4;
}
message AdjustComponentNumber {
  EntityRef owner = 1; FieldRef field = 2; double delta = 3; uint64 expected_version = 4;
}
message ClearComponentOverride { EntityRef owner = 1; FieldRef field = 2; uint64 expected_version = 3; }
message WriteStateSlot {
  StateSlotRef slot = 1; PropertyValue value = 2; uint64 expected_version = 3;
}
message DeleteStateSlot { StateSlotRef slot = 1; uint64 expected_version = 2; }
message GameEffect {
  string once_key = 1;
  oneof action {
    StartQuest start_quest = 2;
    CompleteQuest complete_quest = 3;
    CreditObjective credit_objective = 4;
    ChangeWorldEvent change_world_event = 5;
    OpenQuiz open_quiz = 6;
    RecordQuizResult record_quiz_result = 7;
    GrantRewardPlan grant_reward_plan = 8;
    RollRewardTable roll_reward_table = 9;
    ShowDialogue show_dialogue = 10;
    EmitDomainEvent emit_domain_event = 11;
    SetComponentField set_component_field = 12;
    AdjustComponentNumber adjust_component_number = 13;
    ClearComponentOverride clear_component_override = 14;
    WriteStateSlot write_state_slot = 15;
    DeleteStateSlot delete_state_slot = 16;
    InventoryMutationEffect inventory_mutation = 17;
    InventoryOpenCloseEffect inventory_open_close = 18;
    InventoryEquipEffect inventory_equip = 19;
    InventoryTradeEffect inventory_trade = 20;
    CombatManagerEffect combat_manager = 21;
    NpcBehaviorEffect npc_behavior = 22;
    ExitBehaviorEffect exit_behavior = 23;
    CraftTransactionEffect craft_transaction = 24;
    SocialRelationshipEffect social_relationship = 25;
    TagMutationEffect tag_mutation = 26;
  }
}
enum Disposition {
  DISPOSITION_UNSPECIFIED = 0;
  CONTINUE_DEFAULT = 1;
  APPEND_BEFORE = 2;
  REPLACE_DEFAULT = 3;
  VETO = 4;
  DEFER = 5;
  ENQUEUE_AFTER = 6;
}
message HookQueryResult {
  oneof result { bool keep_default = 1; string replace_text = 2; string deny_error_code = 3; }
}
message HookReply {
  uint32 protocol_major = 1;
  string invocation_id = 2;
  AssetRef binding = 3;
  Disposition disposition = 4;
  repeated GameEffect effects = 5;
  string safe_error_code = 6;
  AssetRef deferred_prompt = 7;
  string trace_id = 8;
  HookQueryResult query_result = 9;
}
message ProtocolHello {
  uint32 min_major = 1;
  uint32 max_major = 2;
  string worker_build_hash = 3;
  string sdk_contract_hash = 4;
  string release_hash = 5;
}

message WorkerReady {
  uint32 protocol_major = 1;
  string release_hash = 2;
  uint32 bound_handlers = 3;
}
message WorkerFrame {
  oneof payload {
    ProtocolHello hello = 1;
    WorkerReady ready = 2;
    HookInvoke invoke = 3;
    HookReply reply = 4;
  }
}
