syntax = "proto3";
package mudmaker.engine.v1;
import "scripting/v1/mudmaker_scripting_v1.proto";

message ProtocolVersion { uint32 major = 1; uint32 minor = 2; }
message Envelope {
  ProtocolVersion protocol = 1;
  uint64 request_id = 2;
  string connection_id = 3;
  oneof body {
    Hello hello = 10;
    HelloAck hello_ack = 11;
    InspectEntity inspect_entity = 12;
    EntityInspection entity_inspection = 13;
    ProtocolError error = 14;
    CatalogRequest catalog_request = 15;
    CatalogResult catalog_result = 16;
    ListEntitiesRequest list_entities_request = 17;
    ListEntitiesResult list_entities_result = 18;
    CreateEntityRequest create_entity_request = 19;
    CreateEntityResult create_entity_result = 20;
    DestroyEntityRequest destroy_entity_request = 21;
    AddComponentRequest add_component_request = 22;
    RemoveComponentRequest remove_component_request = 23;
    ReplaceComponentRequest replace_component_request = 24;
    ReplaceFieldRequest replace_field_request = 25;
    MutationAck mutation_ack = 26;
    ShutdownRequest shutdown_request = 27;
    ShutdownAck shutdown_ack = 28;
  }
}
message Hello { bytes pairing_token = 1; uint32 min_minor = 2; uint32 max_minor = 3; }
message HelloAck { uint32 selected_minor = 1; string engine_version = 2; string world_id = 3; }
message InspectEntity { mudmaker.scripting.v1.EntityRef entity = 1; }
message EntityInspection { mudmaker.scripting.v1.EntityRef entity = 1; repeated ComponentValue components = 2; }
message ComponentValue { string component_type_id = 1; uint32 schema_revision = 2; EngineValue value = 3; }
message EngineValue {
  oneof value {
    mudmaker.scripting.v1.PropertyValue primitive = 1;
    RecordValue record = 2;
    ListValue list = 3;
  }
}
message RecordValue { repeated RecordField fields = 1; }
message RecordField { string field_id = 1; EngineValue value = 2; }
message ListValue { repeated EngineValue values = 1; }
enum ErrorCode {
  UNSPECIFIED = 0;
  MALFORMED_FRAME = 1;
  MALFORMED_MESSAGE = 2;
  UNSUPPORTED_PROTOCOL = 3;
  UNAUTHORIZED = 4;
  INVALID_REQUEST = 5;
  WORLD_FAILURE = 6;
  NOT_READY = 7;
  SHUTTING_DOWN = 8;
  INTERNAL_FAILURE = 9;
}
message ProtocolError {
  ErrorCode code = 1;
  string message = 2;
  string native_code = 3;
  optional string world_id = 4;
  optional mudmaker.scripting.v1.EntityRef entity = 5;
  optional string component_type_id = 6;
  optional uint32 schema_revision = 7;
  repeated string field_path = 8;
}

message CatalogRequest { uint64 offset = 1; uint32 limit = 2; }
message CatalogResult { repeated ComponentSchemaInfo schemas = 1; uint64 total = 2; optional uint64 next_offset = 3; }
message ListEntitiesRequest { uint64 offset = 1; uint32 limit = 2; }
message ListEntitiesResult { repeated mudmaker.scripting.v1.EntityRef entities = 1; uint64 total = 2; optional uint64 next_offset = 3; }
message CreateEntityRequest { repeated ComponentValue components = 1; }
message CreateEntityResult { mudmaker.scripting.v1.EntityRef entity = 1; }
message DestroyEntityRequest { mudmaker.scripting.v1.EntityRef entity = 1; }
message AddComponentRequest { mudmaker.scripting.v1.EntityRef entity = 1; ComponentValue component = 2; }
message RemoveComponentRequest { mudmaker.scripting.v1.EntityRef entity = 1; string component_type_id = 2; uint32 schema_revision = 3; }
message ReplaceComponentRequest { mudmaker.scripting.v1.EntityRef entity = 1; ComponentValue component = 2; }
message ReplaceFieldRequest { mudmaker.scripting.v1.EntityRef entity = 1; string component_type_id = 2; uint32 schema_revision = 3; string field_id = 4; EngineValue value = 5; }
message MutationAck { mudmaker.scripting.v1.EntityRef entity = 1; }
message ShutdownRequest {}
message ShutdownAck {}
enum ValueKind { VALUE_KIND_UNSPECIFIED = 0; VALUE_KIND_BOOLEAN = 1; VALUE_KIND_INTEGER = 2; VALUE_KIND_FLOATING = 3; VALUE_KIND_TEXT = 4; VALUE_KIND_ENTITY = 5; VALUE_KIND_ASSET = 6; VALUE_KIND_RECORD = 7; VALUE_KIND_LIST = 8; }
enum Persistence { PERSISTENCE_UNSPECIFIED = 0; PERSISTENCE_TRANSIENT = 1; PERSISTENCE_PERSISTENT = 2; }
enum Placement { PLACEMENT_UNSPECIFIED = 0; PLACEMENT_ARCHETYPE = 1; PLACEMENT_SPARSE = 2; }
message ComponentSchemaInfo { string component_type_id = 1; uint32 schema_revision = 2; string name = 3; Persistence persistence = 4; string display = 5; string description = 6; repeated FieldInfo fields = 7; repeated TypeInfo types = 8; Placement placement = 9; }
message FieldInfo { string field_id = 1; string name = 2; bool required = 3; EngineValue default_value = 4; string display = 5; string description = 6; uint32 type_id = 7; }
message TypeInfo { uint32 type_id = 1; ValueKind kind = 2; bool nullable = 3; Constraints constraints = 4; repeated FieldInfo fields = 5; uint32 element_type_id = 6; }
message Constraints { optional sint64 integer_min = 1; optional sint64 integer_max = 2; optional double floating_min = 3; optional double floating_max = 4; optional uint64 text_min_bytes = 5; optional uint64 text_max_bytes = 6; optional uint64 list_min_items = 7; optional uint64 list_max_items = 8; repeated EngineValue enum_values = 9; }
message RuntimeSettings { uint32 schema_nodes = 1; uint32 schema_name_bytes = 2; uint64 chunk_target_bytes = 3; uint32 page_limit = 4; uint32 minimum_control_frame_bytes = 5; uint32 error_text_bytes = 6; uint32 error_path_bytes = 7; uint32 connect_timeout_ms = 8; uint32 hello_timeout_ms = 9; uint32 frame_io_timeout_ms = 10; uint32 cancel_drain_timeout_ms = 11; uint32 process_exit_timeout_ms = 12; uint32 pipe_buffer_bytes = 13; }
